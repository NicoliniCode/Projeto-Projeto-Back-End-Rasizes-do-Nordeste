services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes_local
      POSTGRES_DB: raizes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizes -d raizes"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
